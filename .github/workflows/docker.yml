name: docker

# Assembles, tests and (optionally) pushes the images to ghcr.io and, when
# configured, Docker Hub:
#   <version>-linux             linux/amd64, linux/386 (static musl, FROM scratch)
#   <version>-windows-ltsc2022  windows/amd64 (Nano Server)
#   <version>-windows-ltsc2025  windows/amd64 (Nano Server)
#   <version>                   all of the above in one manifest list
# Needs the bin-* artifacts produced by build.yml in the same run.
#
# Docker Hub is enabled by the repository variable DOCKERHUB_USERNAME plus the
# secret DOCKERHUB_TOKEN (an access token with read/write scope). The image
# defaults to <DOCKERHUB_USERNAME>/tiny-hc; override with the variable
# DOCKERHUB_IMAGE (e.g. myorg/tiny-hc).
on:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false
      version:
        description: Version used for the tags (e.g. v1.2.3)
        type: string
        required: true
    secrets:
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.meta.outputs.images }}
      dockerhub: ${{ steps.meta.outputs.dockerhub }}
    steps:
      - id: meta
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PUSH: ${{ inputs.push }}
        run: |
          images="ghcr.io/${GITHUB_REPOSITORY,,}"
          dockerhub=false
          if [[ -n "$DOCKERHUB_USERNAME" ]]; then
            if [[ "$PUSH" == true && -z "$DOCKERHUB_TOKEN" ]]; then
              echo "::error::DOCKERHUB_USERNAME is set but the DOCKERHUB_TOKEN secret is missing"
              exit 1
            fi
            images+=" docker.io/${DOCKERHUB_IMAGE:-$DOCKERHUB_USERNAME/tiny-hc}"
            dockerhub=true
          fi
          echo "images=${images,,}" >> "$GITHUB_OUTPUT"
          echo "dockerhub=$dockerhub" >> "$GITHUB_OUTPUT"
          echo "Publishing to: $images"

  linux:
    needs: meta
    runs-on: ubuntu-latest
    env:
      IMAGES: ${{ needs.meta.outputs.images }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: bin-*-linux-musl
          path: dist/
      - run: for d in dist/bin-*; do mv "$d" "dist/${d#dist/bin-}"; done; ls -R dist

      - uses: docker/setup-buildx-action@v3

      - name: Test
        run: |
          for pair in linux/amd64:x86_64 linux/386:i686; do
            platform="${pair%%:*}"
            bin="/dist/${pair##*:}-unknown-linux-musl"
            docker buildx build --load --platform "$platform" -t test .
            docker run --rm --platform "$platform" test --version
            docker run --rm --platform "$platform" --entrypoint /bin/tiny-hc-tls test --timeout 15 https://github.com/
            # The static binaries must also work when copied into glibc and musl images.
            for base in debian:stable-slim alpine:latest; do
              docker run --rm --platform "$platform" -v "$PWD/dist:/dist:ro" "$base" \
                "$bin/tiny-hc-tls" --timeout 15 https://github.com/
            done
          done

      - if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: inputs.push && needs.meta.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        if: inputs.push
        run: |
          tags=()
          for image in $IMAGES; do
            while read -r tag; do tags+=(-t "$tag"); done < <(scripts/docker-tags.sh "$image" linux "${{ inputs.version }}")
          done
          docker buildx build --push --platform linux/amd64,linux/386 \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${{ inputs.version }}" \
            "${tags[@]}" .

  windows:
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, flavour: windows-ltsc2022, base: ltsc2022 }
          - { os: windows-2025, flavour: windows-ltsc2025, base: ltsc2025 }
    env:
      IMAGES: ${{ needs.meta.outputs.images }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: bin-x86_64-pc-windows-msvc
          path: dist/x86_64-pc-windows-msvc/

      - name: Build
        run: |
          docker build -f Dockerfile.windows --build-arg WINDOWS_VERSION=${{ matrix.base }} \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${{ inputs.version }}" \
            -t test .

      - name: Test
        run: |
          docker run --rm test --version
          docker run --rm --entrypoint 'C:\tiny-hc\tiny-hc-tls.exe' test --timeout 15 https://github.com/

      - if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: inputs.push && needs.meta.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        if: inputs.push
        run: |
          for image in $IMAGES; do
            scripts/docker-tags.sh "$image" ${{ matrix.flavour }} "${{ inputs.version }}" | while read -r tag; do
              docker tag test "$tag"
              docker push "$tag"
            done
          done

  manifest:
    if: inputs.push
    needs: [meta, linux, windows]
    runs-on: ubuntu-latest
    env:
      IMAGES: ${{ needs.meta.outputs.images }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: needs.meta.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge linux + windows into the plain tags
        run: |
          for image in $IMAGES; do
            tags() { scripts/docker-tags.sh "$image" "$1" "${{ inputs.version }}"; }
            paste -d ' ' <(tags "") <(tags linux) <(tags windows-ltsc2022) <(tags windows-ltsc2025) |
              while read -r target sources; do
                # shellcheck disable=SC2086
                docker buildx imagetools create -t "$target" $sources
              done
          done
