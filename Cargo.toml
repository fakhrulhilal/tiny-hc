cargo-features = ["panic-immediate-abort"]

[package]
name = "tiny-hc"
version = "0.1.3"
edition = "2024"
description = "Tiny HTTP/HTTPS health check binary for containers"
license = "MIT"
publish = false

[lib]
name = "tiny_hc"
path = "src/lib.rs"

[[bin]]
name = "tiny-hc"
path = "src/bin/tiny-hc.rs"

# build.rs compiles a trimmed mbedTLS from vendor/mbedtls (scripts/fetch-mbedtls.sh).
[build-dependencies]
cc = "1.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

# What scripts/build.sh ships: release plus a size-optimised std, built with
#   -Zbuild-std=std,panic_abort -Zbuild-std-features=optimize_for_size
# Panics abort without printing anything (all errors are handled explicitly).
[profile.dist]
inherits = "release"
panic = "immediate-abort"
